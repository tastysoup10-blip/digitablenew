name: Deploy Digitable to GitHub Pages

on:
  push:
    branches: [github-pages-static]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install

      - name: Build SVG canvas dependency
        run: |
          npm install --prefix "$GITHUB_WORKSPACE/svgedit/packages/svgcanvas" --no-save --ignore-scripts vite pathseg jspdf svg2pdf.js
          test -x "$GITHUB_WORKSPACE/svgedit/packages/svgcanvas/node_modules/.bin/vite"
          "$GITHUB_WORKSPACE/svgedit/packages/svgcanvas/node_modules/.bin/vite" build
        working-directory: svgedit/packages/svgcanvas

      - name: Build static app
        run: bun run --filter=@svg-table/app build
        env:
          BASE_PATH: /digitablenew/app
          PUBLIC_APP_VERSION: github-pages
          BETTER_AUTH_URL: https://tastysoup10-blip.github.io
          BETTER_AUTH_SECRET: github-pages-build-only-placeholder-secret

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/app/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
